name: Safeword advisory PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

jobs:
  readiness:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # Serialize per pull request and let the newest event win. Without this a
    # delayed run can publish its stale snapshot over a newer verdict — a
    # draft run reporting success after a ready run already reported failure.
    concurrency:
      group: pr-readiness-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Deterministic, no model, no checkout: reports whether the readiness
      # evidence in the body still names this head. Deliberately outside the
      # advisory worker so it still runs when a review route is unavailable.
      - name: Report readiness evidence freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAFEWORD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --yes safeword@0.83.1 --no-input --json review-pr readiness

  event-review:
    if: github.event_name == 'pull_request_target' && github.event.action != 'edited'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/safeword-pr-review-worker.yml
    secrets: inherit
    with:
      pull_number: ${{ github.event.pull_request.number }}
      cancel_in_progress: ${{ github.event.action == 'converted_to_draft' }}
      inspect_requested: ${{ github.event.action != 'converted_to_draft' }}
      write_requested: false

  discover-ready-pull-requests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pull_numbers: ${{ steps.discover.outputs.pull_numbers }}
    steps:
      - id: discover
        name: Discover ready pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_numbers="$({
            gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[] | select(.draft | not) | [.number, .head.sha] | @tsv' |
              while IFS=$'\t' read -r pull_number head_sha; do
                terminal="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pull_number/comments?per_page=100" --paginate --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"<!-- safeword:pr-review-receipt:v1 -->\")) and (.body | contains(\"Reviewed revision: $head_sha\")) and (.body | contains(\"\\nRoute:\")))] | length" | awk '{ total += $1 } END { print total + 0 }')"
                if [ "$terminal" = "0" ]; then echo "$pull_number"; fi
              done
          } | jq -cs 'map(tonumber)')"
          echo "pull_numbers=$pull_numbers" >> "$GITHUB_OUTPUT"

  scheduled-review:
    needs: discover-ready-pull-requests
    if: needs.discover-ready-pull-requests.outputs.pull_numbers != '[]'
    strategy:
      matrix:
        pull_number: ${{ fromJSON(needs.discover-ready-pull-requests.outputs.pull_numbers) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/safeword-pr-review-worker.yml
    secrets: inherit
    with:
      pull_number: ${{ matrix.pull_number }}
      cancel_in_progress: false
      inspect_requested: true
      write_requested: true
