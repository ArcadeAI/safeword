name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at midnight UTC - catches runner image and environmental drift
    - cron: '0 0 * * 0'

# Cancel superseded PR runs; main pushes each get a unique group (run_id) so they queue
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dogfood-parity:
    name: Dogfood parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check template and dogfood parity
        # Kept as its own PR status so template/dogfood drift is immediately
        # visible and can be made a required branch-protection check.
        run: bun scripts/parity-check.ts --mode=all

  cli-contract:
    name: CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The CLI contract verifies historical Claude release fixtures.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check public CLI contract
        run: bun run check:cli-contract

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Block high and critical advisories
        # Lower-severity advisories stay visible to local and repository audits
        # without letting an unpatchable development-only advisory halt delivery.
        run: bun audit --audit-level high

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # 30 (was 20): headroom for the growing suite + setup. The suite runs
    # parallel (vitest maxWorkers:3 on the 4-vCPU runner); sequential timed out.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.18.1']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historical manual-review seals hash the reviewed ancestor blobs.
          # A depth-1 PR checkout contains only the synthetic merge commit and
          # cannot prove that immutable snapshot.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false # No go.mod in repo — Go is only here for the golangci-lint binary

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/requirements-ci.txt'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Pre-built binary (~3s) instead of go install (~55s compile from source)
      - name: Install golangci-lint v2
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.10.1

      - name: Install Python tools
        run: pip install -r .github/requirements-ci.txt

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test all packages
        run: bun run test
        env:
          TEST_POETRY: '1'

      - name: Non-git physical install proof
        # Keeps the expensive install path out of the default suite while
        # preserving automated coverage for setup outside a Git repository.
        run: bun run --cwd packages/cli test:slow:install-proof

      - name: Acceptance lane (cucumber)
        if: matrix.node-version == '24.18.1'
        # Guards the Gherkin acceptance lane against features merged with no step
        # definitions and no @wip tag — a persistently-red lane masks real
        # regressions (issue #341). Runs after Build because some step defs spawn
        # the built CLI (dist/cli.js). Package and release gates run on both Node
        # versions; this version-independent behavior lane runs once per commit.
        # Features whose proof lives in Vitest use @proof.vitest, with a pointer
        # to their executable proof in the .feature file.
        run: bun run test:bdd

      - name: Release-gate tests (supply-chain + dogfood parity)
        # Runs the *.release.test.ts files excluded from the main suite.
        # Includes the no-install-scripts.release.test.ts guard which would
        # otherwise only fire at `bun publish` time via prepublishOnly —
        # bypassable when publishing pre-built tarballs. Wiring to CI makes
        # this defense per-PR and unbypassable.
        run: bun run --cwd packages/cli test:release

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Claude migration ownership is generated from historical release
          # tags, so the catalogue freshness gate needs the same full history
          # as the test and release jobs.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Ticket closure rides ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: |
          changed_files_path=/tmp/safeword-pr-changed-files.txt
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$changed_files_path"
          expected_changed_files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')"
          actual_changed_files="$(wc -l < "$changed_files_path")"
          if (( actual_changed_files != expected_changed_files )); then
            echo "::error::GitHub returned $actual_changed_files of $expected_changed_files changed files."
            exit 1
          fi
          unset GH_TOKEN
          bun scripts/check-pr-ticket-done.ts --changed-files "$changed_files_path"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned actionlint
        run: |
          mkdir -p /tmp/safeword-actionlint
          curl --fail --location --silent --show-error \
            --output /tmp/safeword-actionlint/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/safeword-actionlint/actionlint.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file /tmp/safeword-actionlint/actionlint.tar.gz \
            --directory /tmp/safeword-actionlint actionlint

      - name: Validate installed advisory PR review workflows
        run: bun run --cwd packages/cli check:pr-review-workflows
        env:
          SAFEWORD_ACTIONLINT: /tmp/safeword-actionlint/actionlint

      - name: Lockfile sync check
        # --frozen-lockfile catches resolved-version drift, but lets
        # cosmetic constraint-mirror drift slip through (e.g. package.json
        # pins `knip: 6.4.1` while bun.lock still has `^6.4.1`).
        # `bun install --lockfile-only` regenerates only the lockfile
        # (~17ms on synced tree, no node_modules writes); any diff means
        # the constraint mirror has drifted from package.json.
        run: |
          bun install --lockfile-only
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock drifted from package.json. Run 'bun install' locally and commit."
            exit 1
          }

      - name: Claude plugin catalogue freshness
        run: |
          bun run --cwd packages/cli generate:claude-plugin
          git diff --exit-code -- plugin || {
            echo "::error::Generated Claude plugin drifted from canonical sources. Run 'bun run --cwd packages/cli generate:claude-plugin' and commit plugin/."
            exit 1
          }
          bun run --cwd packages/cli check:claude-plugin

      - name: Lint
        run: bun run lint

      - name: Shellcheck
        # The deterministic shell-lint gate (#966): pre-commit's *.sh rule is
        # guarded (skips on machines without shellcheck), so this lane is where
        # the check is guaranteed to run — ubuntu-latest preinstalls shellcheck.
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Format check
        # prettier --check . — guards against formatting drift that eslint
        # does not catch. Pre-commit (lint-staged) only formats staged files,
        # so drift could land on main undetected before this step existed.
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Architecture check
        run: bun run deps

      - name: Architecture doc freshness (FPV0E4)
        # Hard backstop: fails the build if the generated architecture state doc
        # (.project/architecture.generated.md) is stale — i.e. the commit-time
        # auto-fix hook was bypassed or a doc was hand-committed out of band.
        # Honors the per-project opt-out (architectureDocEnforcement: false).
        run: bun packages/cli/src/cli.ts architecture --check

      - name: Duplicate ticket-ID guard
        # ticket 158: two ticket folders with the same `id:` frontmatter is
        # silent corruption — block merges if it ever lands.
        run: bun scripts/check-ticket-ids.ts

      - name: Version consistency check
        run: |
          CLI_VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          MARKETPLACE_VERSION=$(node -e "console.log(require('./.claude-plugin/marketplace.json').plugins[0].version)")
          if [ "$CLI_VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "::error::Version mismatch: CLI=$CLI_VERSION Marketplace=$MARKETPLACE_VERSION"
            exit 1
          fi
          echo "Versions consistent: $CLI_VERSION"

  relay-inputs:
    name: Retro relay deployment inputs
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changed
        name: Detect relay deployment inputs
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ -z "$BEFORE" ]; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          git diff --name-only "$BEFORE" "$SHA" | while IFS= read -r changed; do
            case "$changed" in
              packages/retro-relay/*|packages/cli/package.json|packages/website/package.json|package.json|bun.lock|tsconfig.json|.dockerignore|railway.json|.github/workflows/deploy-retro-relay.yml|.github/workflows/ci.yml)
                echo 'deploy=true' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          if ! grep -q '^deploy=true$' "$GITHUB_OUTPUT"; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  deploy-retro-relay:
    name: Deploy Retro Relay
    # High and critical advisories block automatic production delivery. The
    # environment-protected deploy-retro-relay workflow stays the manual
    # break-glass path for an urgent relay security fix.
    needs: [dogfood-parity, dependency-audit, test, lint, relay-inputs]
    if: github.ref == 'refs/heads/main' && needs.relay-inputs.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: retro-relay-production
    concurrency:
      group: retro-relay-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.3

      - name: Validate deployment configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_RETRO_RELAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_RETRO_RELAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_RETRO_RELAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo '::error::Missing RAILWAY_TOKEN environment secret. Add a project-scoped Railway token.'
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_ENVIRONMENT" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo '::error::Missing Railway production environment configuration.'
            exit 1
          fi

      - name: Deploy through Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_RETRO_RELAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_RETRO_RELAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_RETRO_RELAY_SERVICE }}
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_SERVICE"

  collector-inputs:
    name: Retro collector deployment inputs
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changed
        name: Detect collector deployment inputs
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ -z "$BEFORE" ]; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          git diff --name-only "$BEFORE" "$SHA" | while IFS= read -r changed; do
            case "$changed" in
              packages/retro-collector/*|packages/cli/package.json|packages/website/package.json|package.json|bun.lock|tsconfig.json|.dockerignore|railway.json|.github/workflows/deploy-retro-collector.yml|.github/workflows/ci.yml)
                echo 'deploy=true' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          if ! grep -q '^deploy=true$' "$GITHUB_OUTPUT"; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  deploy-retro-collector:
    name: Deploy Retro Collector
    needs: [dogfood-parity, dependency-audit, test, lint, collector-inputs]
    if: github.ref == 'refs/heads/main' && needs.collector-inputs.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: retro-relay-production
    concurrency:
      group: retro-collector-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.3

      - name: Validate deployment configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_RETRO_RELAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_RETRO_RELAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_RETRO_COLLECTOR_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo '::error::Missing RAILWAY_TOKEN environment secret. Add a project-scoped Railway token.'
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_ENVIRONMENT" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo '::error::Missing Railway collector production configuration.'
            exit 1
          fi

      - name: Deploy through Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_RETRO_RELAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_RETRO_RELAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_RETRO_COLLECTOR_SERVICE }}
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_SERVICE"
