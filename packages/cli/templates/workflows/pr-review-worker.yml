name: Safeword advisory PR review worker

on:
  workflow_call:
    inputs:
      pull_number:
        required: true
        type: number
      cancel_in_progress:
        required: true
        type: boolean
      inspect_requested:
        required: true
        type: boolean

concurrency:
  group: pr-review-${{ inputs.pull_number }}
  cancel-in-progress: ${{ inputs.cancel_in_progress }}

permissions: {}

jobs:
  invalidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Invalidate any obsolete advisory route
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SAFEWORD_PR_NUMBER: ${{ inputs.pull_number }}
        run: npx --yes safeword@0.73.0 --no-input --json review-pr invalidate

  inspect:
    needs: invalidate
    if: ${{ inputs.inspect_requested }}
    runs-on: ubuntu-latest
    environment:
      name: safeword-pr-review-model
      deployment: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Assemble exact-head evidence as JSON
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SAFEWORD_PR_NUMBER: ${{ inputs.pull_number }}
        run: |
          mkdir -p .safeword
          gh api "repos/$GITHUB_REPOSITORY/contents/.safeword/config.json" --jq .content | base64 --decode > .safeword/config.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SAFEWORD_PR_NUMBER/files" --paginate > pull-files.json
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SAFEWORD_PR_NUMBER" --jq .head.sha)"
          jq --arg head_sha "$head_sha" '{schemaVersion: 1, headSha: $head_sha, artifacts: [.[] | select(.patch != null) | {path: .filename, content: .patch}]}' pull-files.json > inspection-input.json
      - name: Inspect bounded evidence without GitHub write authority
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx --yes safeword@0.73.0 --no-input --json review-pr inspect inspection-input.json --output advisory-result.json
      - name: Upload the JSON-only advisory handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safeword-pr-review-${{ inputs.pull_number }}
          path: advisory-result.json
          if-no-files-found: error

  publish:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Download the JSON-only advisory handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safeword-pr-review-${{ inputs.pull_number }}
      - name: Publish one ordinary pull-request comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SAFEWORD_PR_NUMBER: ${{ inputs.pull_number }}
        run: npx --yes safeword@0.73.0 --no-input --json review-pr publish advisory-result.json
