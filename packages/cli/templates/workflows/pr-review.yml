name: Safeword PR review

# Autonomous PR review at the intent-conformance bar (safeword ticket 36EEMY).
#
# SHIPS DEFAULT-OFF. Both jobs exit immediately unless `.safeword/config.json`
# sets `prReview.enabled: true`. Deleting this file is supported but unnecessary
# — the switch is config, so an upgrade will not reinstate a choice you made.
#
# ─────────────────────────────────────────────────────────────────────────────
# The two-stage split, and why it is shaped this way
#
# The threat is executing untrusted code while a credential is present, NOT
# reading it. So:
#
#   stage 1 (`bundle`)  pull_request — checks out the fork's head, holds NO
#                       secrets, and only reads. Nothing here can leak, because
#                       there is nothing here to leak.
#   stage 2 (`review`)  workflow_run — holds the credentials, and NEVER checks
#                       out the head. It reads the uploaded bundle as inert data.
#
# `actions/checkout@v7` refuses fork-PR head under BOTH `pull_request_target`
# and `workflow_run` by default (opt-out `allow-unsafe-pr-checkout`), which is
# why stage 1 must be `pull_request` and stage 2 must never attempt a checkout.
#
# GitHub gives no token scope that permits commenting while forbidding approval,
# so "it cannot approve" is enforced three ways, not one:
#   1. repo/org setting "Allow GitHub Actions to create and approve pull
#      requests" → OFF  (the real structural control; an install prerequisite)
#   2. branch protection "Require approval of the most recent reviewable push"
#   3. the runner only ever calls POST /pulls/{n}/comments and /check-runs —
#      never /pulls/{n}/reviews, which is what an approval would require
#
# NOTE: `workflow_run` only triggers from the workflow file on the DEFAULT
# branch, so this cannot review the pull request that installs it. The first
# review happens after that PR merges.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_run:
    workflows: ['Safeword PR review']
    types: [completed]

permissions: {}

concurrency:
  group: safeword-pr-review-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  # ── stage 1 ────────────────────────────────────────────────────────────────
  # Unprivileged and secretless. Safe to run against a fork's head because
  # there is no credential present for injected code to reach.
  bundle:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stop unless the project enabled the reviewer
        id: gate
        run: |
          if [ ! -f .safeword/config.json ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          enabled=$(node -e "try{const c=require('./.safeword/config.json');process.stdout.write(String(c?.prReview?.enabled===true))}catch{process.stdout.write('false')}")
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Record the pull request context
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p .safeword-pr-review
          printf '%s' "${{ github.event.pull_request.number }}" > .safeword-pr-review/pull-number
          printf '%s' "${{ github.event.pull_request.head.sha }}" > .safeword-pr-review/head-sha

      - name: Upload the review bundle
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: safeword-pr-review-bundle
          path: .safeword-pr-review/
          retention-days: 1

  # ── stage 2 ────────────────────────────────────────────────────────────────
  # Privileged. Runs in the BASE repository's context, so it may hold
  # credentials — and therefore must never check out the head.
  review:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read the BASE repo only — never the pull request head
      pull-requests: write # post inline comments (see the three-layer note above)
      checks: write # write the non-required `safeword/pr-review` receipt
      id-token: write # exchange for a short-lived vendor token (WIF/OIDC)

    steps:
      - name: Check out the base repository
        uses: actions/checkout@v7
        # No `ref:` — deliberately the base, never the pull request head.

      - name: Download the review bundle
        uses: actions/download-artifact@v4
        with:
          name: safeword-pr-review-bundle
          path: .safeword-pr-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFEWORD_PR_NUMBER="$(cat .safeword-pr-review/pull-number)" \
            bunx --bun safeword review-pr
