# Generated by safeword - DO NOT EDIT
# To customize, add overrides below the formatters section

version: '2'
linters:
  default: standard
  enable:
    - bodyclose
    - nilerr
    - sqlclosecheck
    - rowserrcheck
    - noctx
    - reassign
    - cyclop
    - nestif
    - gocognit
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - prealloc
    - gosec
    - goconst
    - misspell
    - errorlint
    - gocritic
    - revive
    - perfsprint
    - copyloopvar
    - intrange
  disable:
    - forbidigo
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
  settings:
    nestif:
      min-complexity: 4
formatters:
  enable:
    - gofumpt
